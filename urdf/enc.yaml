ekf_filter_node:
  ros__parameters:
    # 1. Core Filter Timing
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true               # CRITICAL: Forces 2D calculation (ignores Z, roll, pitch)
    print_diagnostics: true
    
    # 2. Coordinate Frames (Odom-only mode loop)
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom              # CRITICAL: Local mode. Publishes odom -> base_link transform

    # 3. Transform Buffers (Prevents past extrapolation errors over networks)
    transform_time_offset: 0.0
    transform_timeout: 0.2         # Small look-ahead buffer for stability

    # 4. Sensor Inputs (Fusing Odom Only)
    odom0: odom                    # Set this to your raw wheel odometry topic (e.g., /odom)
    
    # Configuration Matrix Layout mapping:
    # [ x,     y,     z,
    #   roll,  pitch, yaw,
    #   vx,    vy,    vz,
    #   vroll, vpitch, vyaw,
    #   ax,    ay,    az ]
    odom0_config: [false, false, false,  # Do not fuse absolute position (let it integrate)
                   false, false, false,  # Do not fuse absolute orientation 
                   true,  false, false,  # FUSE: Forward linear velocity (vx)
                   false, false, true,   # FUSE: Angular rotational velocity (vyaw)
                   false, false, false]  # No acceleration info inside wheel encoders

    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # 5. Active Kinematic Prediction
    use_control: true              # Fuses /cmd_vel to drastically reduce position tracking lag
    stamped_control: false
    control_timeout: 0.2
    control_config: [true, false, false, false, false, true] # Robot drives forward and spins
