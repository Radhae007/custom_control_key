ekf_filter_node:
  ros__parameters:
    frequency: 20.0
    two_d_mode: true
    publish_tf: true           # <--- CRITICAL: This tells the EKF to publish the odom -> base_link TF!

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom          # Tells EKF that 'odom' is the local origin

    # Configure it to listen to your custom encoder data
    odom0: /odom1               # Change this to match your encoder topic exactly
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
# CONFIGURING YOUR NEW IMU
    imu0: /imu/data_raw
    imu0_config: [false, false, false,  # x,  y,  z
                  false, false, true,   # r,  p,  y   <-- Trust absolute Yaw (if calibrated)
                  false, false, false,  # vx, vy, vz
                  false, false, true,   # vr, vp, vy  <-- Trust Angular Velocity (Yaw rate)
                  true,  false, false]  # ax, ay, az  <-- Trust Linear Acceleration X
imu0_remove_gravitational_acceleration: true
